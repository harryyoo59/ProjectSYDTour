<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>SYD 투어 지도</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Outfit:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="phone-shell" id="app">
      <div class="atmosphere" aria-hidden="true"></div>

      <header class="topbar">
        <button
          type="button"
          class="back-btn"
          id="backBtn"
          hidden
          aria-label="뒤로"
        >
          <span class="back-chevron" aria-hidden="true"></span>
          뒤로
        </button>
        <div class="brand-block">
          <p class="brand">SYD</p>
          <p class="brand-sub" id="screenHint">투어 지도</p>
        </div>
      </header>

      <main class="screen" id="screen">
        <!-- filled by app.js -->
      </main>

      <footer class="foot-note" id="footNote">원하는 곳을 눌러 주세요</footer>
    </div>
    <script src="./app.js?v=11"></script>
  </body>
</html>
